<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7ECEA">
<title>Kilo takibi</title>
<style>
:root{
  --bg:#E7ECEA; --surface:#FFFFFF; --ink:#1B2528; --muted:#6B797E; --line:#D5DDDA;
  --accent:#3A47B0; --down:#1E9E62; --up:#D64550; --same:#9AA4A8;
  --down-bg:#D6F0E2; --up-bg:#F8DADD; --same-bg:#E3E7E8; --first-bg:#E1E4F6;
  --num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;padding:env(safe-area-inset-top) 0 48px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,.dial:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 10px}
header h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.icon-btn svg{width:20px;height:20px}

/* Tartı kartı */
.scale{background:var(--surface);border-radius:28px;padding:16px 0 18px;margin-bottom:12px}
.scale-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px}
.date-input{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink);min-height:36px}
.status-note{font-size:13px;color:var(--muted);text-align:right}
.readout{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px}
.readout .val{display:flex;align-items:baseline;gap:4px}
.readout input{font-family:var(--num);font-size:64px;font-weight:700;letter-spacing:-.03em;text-align:center;border:0;background:none;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;width:4ch;border-radius:10px}
.readout .unit{font-size:22px;color:var(--muted);font-weight:600}
.step{width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:22px;font-weight:600;display:grid;place-items:center;color:var(--ink)}
.dial-box{position:relative;margin-top:4px}
.dial{overflow-x:scroll;overflow-y:hidden;scrollbar-width:none;height:76px;touch-action:pan-x;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);
          mask-image:linear-gradient(to right,transparent,#000 16%,#000 84%,transparent)}
.dial::-webkit-scrollbar{display:none}
.tape{display:inline-block;height:100%;white-space:nowrap;vertical-align:top}
.ticks{position:relative;display:inline-block;height:100%;vertical-align:top}
.rule{position:absolute;left:0;bottom:0;height:48px;
  background-image:
    linear-gradient(to right,var(--ink) 0 2px,transparent 2px),
    linear-gradient(to right,#7E8B90 0 1.5px,transparent 1.5px),
    linear-gradient(to right,#B4BEC1 0 1px,transparent 1px);
  background-size:80px 100%,40px 62%,8px 36%;
  background-repeat:repeat-x;
  background-position:-1px 100%,-.75px 100%,-.5px 100%}
.lab{position:absolute;top:2px;transform:translateX(-50%);font-family:var(--num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lab.major{color:var(--ink);font-weight:700}
.needle{position:absolute;left:50%;top:18px;bottom:0;width:3px;margin-left:-1.5px;background:var(--accent);border-radius:2px;pointer-events:none}
.needle::before{content:"";position:absolute;left:50%;top:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--accent);border-bottom:0}
.save{display:block;width:calc(100% - 32px);margin:16px 16px 0;padding:14px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.save:active{transform:scale(.99)}

/* Hedef paneli */
.stats{background:var(--surface);border-radius:20px;padding:16px 16px 14px;margin-bottom:12px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;line-height:1.2}
.stat small{font-size:13px;color:var(--muted)}
.stat.now b{font-size:30px}
.bar{height:10px;background:var(--same-bg);border-radius:5px;margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--down);border-radius:5px;transition:width .5s ease}
.bar-legend{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:0}

/* Sekmeler */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#D8E0DD;border-radius:14px;padding:4px;margin:4px 0 12px}
.seg button{padding:9px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(27,37,40,.14)}

.card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card-head h2{font-size:17px;font-weight:700}
.card-head .count{font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:2px;background:var(--bg);border-radius:999px;padding:3px}
.chips button{font-size:13px;padding:4px 10px;border-radius:999px;color:var(--muted);font-weight:600}
.chips button.on{background:var(--surface);color:var(--ink)}

/* Grafik */
#chart{width:100%;height:auto;display:block}
#chart .grid{stroke:#E4E9E7;stroke-width:1}
#chart .ax{fill:var(--muted);font-size:10px;font-family:var(--text)}
#chart .goal{stroke:var(--down);stroke-width:1.5;stroke-dasharray:5 4}
#chart .raw{fill:none;stroke:#C3CBCD;stroke-width:1.2;stroke-linejoin:round}
#chart .pt{fill:#98A3A7}
#chart .avg{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
#chart .last{fill:var(--accent);stroke:#fff;stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:7px;height:7px;border-radius:50%;background:#98A3A7}
.lg-line{width:16px;height:3px;border-radius:2px;background:var(--accent)}
.lg-dash{width:16px;border-top:2px dashed var(--down)}
.lg-box{width:12px;height:12px;border-radius:3px}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}

/* Liste */
.entry{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EBEFED}
.entry:first-child{border-top:0}
.entry .d{text-align:left;font-size:15px;padding:2px 0}
.entry .d small{display:block;color:var(--muted);font-size:12px}
.entry .kg{font-size:18px;font-weight:700}
.chip{font-size:13px;font-weight:700;padding:3px 8px;border-radius:8px;min-width:54px;text-align:center;font-family:var(--num);font-variant-numeric:tabular-nums}
.chip.down{background:var(--down-bg);color:#11744A}
.chip.up{background:var(--up-bg);color:#A92F3A}
.chip.same,.chip.first{background:var(--same-bg);color:#5C676B}
.del{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:14px}
.del:hover{background:var(--bg)}

/* Takvim */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav button{width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:18px;font-weight:700}
.back{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:10px;padding:0}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--bg);border-radius:14px;padding:8px 7px 9px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start}
.mini h3{font-size:13px;font-weight:700;margin:0 0 5px 1px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-grid i{aspect-ratio:1;border-radius:2px;background:#fff}
.mini-grid i.blank{background:none}
.mini-grid i.down{background:var(--down)}
.mini-grid i.up{background:var(--up)}
.mini-grid i.same{background:var(--same)}
.mini-grid i.first{background:var(--accent)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1/1.15;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;text-align:left;min-width:0}
.day .n{font-size:12px;color:var(--muted);line-height:1}
.day .w{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;align-self:flex-end;line-height:1;letter-spacing:-.02em}
.day.down{background:var(--down);color:#fff}
.day.up{background:var(--up);color:#fff}
.day.down .n,.day.up .n{color:rgba(255,255,255,.85)}
.day.same{background:var(--same-bg)}
.day.first{background:var(--first-bg)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.future{opacity:.45}

/* Pencereler */
.modal{position:fixed;inset:0;background:rgba(27,37,40,.45);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:24px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:6px}
.sheet p{color:var(--muted);font-size:15px}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;font-family:var(--num);font-size:20px;font-weight:600;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);background:var(--surface)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;padding:12px;border-radius:14px;font-weight:700}
.btn-ghost{background:var(--bg)}
.btn-danger{background:var(--up);color:#fff}
.btn-primary{background:var(--ink);color:#fff}
.backup{margin-top:20px;padding-top:16px;border-top:1px solid #EBEFED}
.backup h4{font-size:15px;margin-bottom:4px}
.backup p{font-size:13px}
.backup .actions{margin-top:10px}
.backup .actions button{font-weight:600;font-size:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:360px){
  .readout input{font-size:54px}
  .year-grid{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Kilo takibi</h1>
    <button class="icon-btn" id="openSettings" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <!-- Tartı -->
  <section class="scale" aria-label="Kilo girişi">
    <div class="scale-top">
      <input type="date" id="date" class="date-input" aria-label="Tarih">
      <span class="status-note" id="note"></span>
    </div>
    <div class="readout">
      <button class="step" id="minus" aria-label="0,1 kg azalt">−</button>
      <div class="val">
        <input id="weight" class="num" inputmode="decimal" autocomplete="off" aria-label="Kilo">
        <span class="unit">kg</span>
      </div>
      <button class="step" id="plus" aria-label="0,1 kg artır">+</button>
    </div>
    <div class="dial-box">
      <div class="dial" id="dial" tabindex="0" aria-label="Kaydırarak kilo seç">
        <div class="tape" id="tape">
          <div class="ticks" id="ticks"><div class="rule" id="rule"></div></div>
        </div>
      </div>
      <div class="needle"></div>
    </div>
    <button class="save" id="save">Kaydet</button>
  </section>

  <!-- Hedef paneli -->
  <section class="stats" aria-label="Özet">
    <div class="stat-row">
      <div class="stat"><b id="sStart">—</b><small>Başlangıç</small></div>
      <div class="stat now"><b id="sNow">—</b><small>Şimdi</small></div>
      <div class="stat"><b id="sGoal">—</b><small>Hedef</small></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="bar-legend"><span id="barL"></span><span id="barR"></span></div>
  </section>

  <!-- Sekmeler -->
  <div class="seg" role="tablist">
    <button role="tab" aria-selected="true" data-tab="pChart">Grafik ve liste</button>
    <button role="tab" aria-selected="false" data-tab="pCal">Takvim</button>
  </div>

  <div id="pChart">
    <section class="card">
      <div class="card-head">
        <h2>Gidişat</h2>
        <div class="chips" id="range">
          <button data-r="30" class="on">30 gün</button>
          <button data-r="90">90 gün</button>
          <button data-r="0">Tümü</button>
        </div>
      </div>
      <svg id="chart" viewBox="0 0 340 190" role="img" aria-label="Kilo grafiği"></svg>
      <p class="empty" id="chartEmpty">Grafik en az 2 kayıttan sonra çizilir.</p>
      <div class="legend">
        <span><i class="lg-dot"></i>Günlük tartı</span>
        <span><i class="lg-line"></i>7 günlük ortalama</span>
        <span><i class="lg-dash"></i>Hedef</span>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Kayıtlar <span class="count" id="count"></span></h2></div>
      <div id="list"></div>
    </section>
  </div>

  <div id="pCal" hidden>
    <section class="card">
      <button class="back" id="calBack" hidden>‹ Tüm yıl</button>
      <div class="card-head">
        <h2 id="calTitle"></h2>
        <div class="cal-nav">
          <button id="calPrev" aria-label="Önceki">‹</button>
          <button id="calNext" aria-label="Sonraki">›</button>
        </div>
      </div>
      <div id="calBody"></div>
      <div class="legend">
        <span><i class="lg-box" style="background:var(--down)"></i>Düştü</span>
        <span><i class="lg-box" style="background:var(--up)"></i>Arttı</span>
        <span><i class="lg-box" style="background:var(--same)"></i>Aynı</span>
        <span><i class="lg-box" style="background:var(--accent)"></i>İlk kayıt</span>
      </div>
    </section>
  </div>
</div>

<!-- Onay penceresi -->
<div class="modal" id="confirmModal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <h3 id="cTitle"></h3>
    <p id="cText"></p>
    <div class="actions">
      <button class="btn-ghost" id="cNo">Vazgeç</button>
      <button class="btn-danger" id="cYes">Sil</button>
    </div>
  </div>
</div>

<!-- Ayarlar -->
<div class="modal" id="settingsModal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <h3 id="stTitle">Ayarlar</h3>
    <label class="field"><span>Hedef kilo</span><input id="goalIn" inputmode="decimal" placeholder="Örn. 72"></label>
    <label class="field"><span>Başlangıç kilosu (boş bırakırsan ilk kaydın kullanılır)</span><input id="startIn" inputmode="decimal" placeholder="İlk kayıt"></label>
    <div class="actions">
      <button class="btn-ghost" id="stCancel">Vazgeç</button>
      <button class="btn-primary" id="stSave">Kaydet</button>
    </div>
    <div class="backup">
      <h4>Yedek</h4>
      <p>Kayıtlar bu cihazın tarayıcısında durur. Telefon değiştirirken yedeği indirip yeni cihazda yükle.</p>
      <div class="actions">
        <button class="btn-ghost" id="exportBtn">Yedeği indir</button>
        <button class="btn-ghost" id="importBtn">Yedek yükle</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY = 'kilo-takibi-v1';
  const MIN = 30, MAX = 200, STEP = 8; // STEP: 0,1 kg başına piksel
  const $ = s => document.querySelector(s);
  const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

  // ---------- Veri ----------
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s.entries === 'object') return { entries: s.entries, goal: s.goal ?? null, start: s.start ?? null };
    }catch(e){}
    return { entries:{}, goal:null, start:null };
  }
  let state = load();
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  const pad = n => String(n).padStart(2,'0');
  const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
  const todayKey = () => keyOf(new Date());
  const r1 = n => Math.round(n*10)/10;
  const fmt = (n,dec=1) => Number(n).toLocaleString('tr-TR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const parseNum = s => { const n = parseFloat(String(s).replace(',','.').trim()); return isFinite(n) ? n : null; };
  const sortedKeys = () => Object.keys(state.entries).sort();

  function statusMap(){
    const keys = sortedKeys(), m = {};
    keys.forEach((k,i) => {
      if (i === 0){ m[k] = { s:'first', diff:0 }; return; }
      const diff = r1(state.entries[k] - state.entries[keys[i-1]]);
      m[k] = { s: diff < 0 ? 'down' : diff > 0 ? 'up' : 'same', diff };
    });
    return m;
  }

  // ---------- Tartı kadranı ----------
  const dial = $('#dial'), tape = $('#tape'), ticks = $('#ticks'), rule = $('#rule'), wInput = $('#weight');
  let value = 70, snapT = null, progT = null, programmatic = false;

  function buildDial(){
    const width = (MAX-MIN)*10*STEP;
    ticks.style.width = width + 'px';
    rule.style.width = (width + 2) + 'px';
    let html = '';
    for (let k = MIN; k <= MAX; k++){
      html += `<span class="lab${k%5===0?' major':''}" style="left:${(k-MIN)*10*STEP}px">${k}</span>`;
    }
    ticks.insertAdjacentHTML('beforeend', html);
  }
  function showValue(){
    wInput.value = fmt(value);
    wInput.style.width = (wInput.value.length - 0.3) + 'ch';
  }
  function setValue(v, smooth){
    v = Math.min(MAX, Math.max(MIN, r1(v)));
    value = v; showValue();
    programmatic = true;
    dial.scrollTo({ left:(v-MIN)*10*STEP, behavior: smooth ? 'smooth' : 'auto' });
    clearTimeout(progT);
    progT = setTimeout(() => { programmatic = false; }, smooth ? 450 : 60);
  }
  function layoutDial(){
    const half = dial.clientWidth/2;
    tape.style.paddingLeft = tape.style.paddingRight = half + 'px';
    setValue(value, false);
  }
  dial.addEventListener('scroll', () => {
    const v = r1(MIN + Math.round(dial.scrollLeft/STEP)/10);
    if (v !== value){ value = v; showValue(); }
    if (programmatic) return;
    clearTimeout(snapT);
    snapT = setTimeout(() => {
      const x = (value-MIN)*10*STEP;
      if (Math.abs(dial.scrollLeft - x) > 0.5) dial.scrollTo({ left:x, behavior:'smooth' });
    }, 140);
  }, { passive:true });
  dial.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ dial.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive:false });
  dial.addEventListener('keydown', e => {
    const d = e.shiftKey ? 1 : 0.1;
    if (e.key === 'ArrowLeft'){ setValue(value - d, true); e.preventDefault(); }
    if (e.key === 'ArrowRight'){ setValue(value + d, true); e.preventDefault(); }
  });
  $('#minus').onclick = () => setValue(value - 0.1, true);
  $('#plus').onclick = () => setValue(value + 0.1, true);
  wInput.addEventListener('focus', () => wInput.select());
  wInput.addEventListener('input', () => { wInput.style.width = Math.max(3, wInput.value.length + 0.5) + 'ch'; });
  wInput.addEventListener('keydown', e => { if (e.key === 'Enter') wInput.blur(); });
  wInput.addEventListener('change', () => {
    const n = parseNum(wInput.value);
    if (n === null) showValue(); else setValue(n, true);
  });
  wInput.addEventListener('blur', () => { const n = parseNum(wInput.value); if (n === null) showValue(); });

  // ---------- Tarih ve kayıt ----------
  const dateInput = $('#date');
  function syncDate(moveDial){
    const k = dateInput.value;
    const has = k in state.entries;
    $('#save').textContent = has ? 'Güncelle' : 'Kaydet';
    $('#note').textContent = has ? 'Bu gün kayıtlı' : (k === todayKey() ? 'Bugünün tartısı' : 'Yeni kayıt');
    if (has && moveDial) setValue(state.entries[k], true);
  }
  function openDate(k){
    if (k > todayKey()){ toast('İleri tarihe kayıt eklenemez'); return; }
    dateInput.value = k;
    syncDate(true);
    window.scrollTo({ top:0, behavior:'smooth' });
  }
  dateInput.addEventListener('change', () => syncDate(true));

  $('#save').onclick = () => {
    const k = dateInput.value;
    if (!k){ toast('Önce bir tarih seç'); return; }
    if (k > todayKey()){ toast('İleri tarihe kayıt eklenemez'); return; }
    const had = k in state.entries;
    state.entries[k] = value;
    persist(); renderAll();
    toast(had ? 'Güncellendi' : 'Kaydedildi');
  };

  // ---------- Özet ----------
  function renderStats(){
    const keys = sortedKeys();
    const now = keys.length ? state.entries[keys[keys.length-1]] : null;
    const start = state.start != null ? state.start : (keys.length ? state.entries[keys[0]] : null);
    const goal = state.goal;
    $('#sStart').textContent = start != null ? fmt(start) : '—';
    $('#sNow').textContent = now != null ? fmt(now) : '—';
    $('#sGoal').textContent = goal != null ? fmt(goal) : '—';
    const bar = $('#barFill'), L = $('#barL'), R = $('#barR');
    if (now == null){
      bar.style.width = '0'; L.textContent = 'İlk tartını yukarıdan kaydet'; R.textContent = ''; return;
    }
    const lost = r1(start - now);
    L.textContent = lost > 0 ? fmt(lost)+' kg verdin' : lost < 0 ? fmt(-lost)+' kg aldın' : 'Başlangıç kilondasın';
    if (goal == null){
      bar.style.width = '0';
      R.innerHTML = '<button class="link" id="setGoal">Hedef belirle</button>';
      $('#setGoal').onclick = openSettings;
      return;
    }
    const total = start - goal;
    const p = total > 0 ? Math.min(1, Math.max(0, (start-now)/total)) : 0;
    bar.style.width = (p*100) + '%';
    const left = r1(now - goal);
    R.textContent = left > 0 ? fmt(left)+' kg kaldı' : 'Hedefe ulaştın';
  }

  // ---------- Grafik ----------
  let range = 30;
  const niceStep = x => { const p = Math.pow(10, Math.floor(Math.log10(x))); const n = x/p; return (n<1.5?1:n<3.5?2:n<7.5?5:10)*p; };
  const shortDate = k => { const d = parseKey(k); return d.getDate()+' '+AYLAR[d.getMonth()].slice(0,3); };

  function renderChart(){
    const keys = sortedKeys(), svg = $('#chart'), empty = $('#chartEmpty');
    let ks = keys;
    if (range && keys.length){
      const from = parseKey(keys[keys.length-1]); from.setDate(from.getDate()-range+1);
      const fk = keyOf(from); ks = keys.filter(k => k >= fk);
    }
    if (ks.length < 2){ svg.innerHTML = ''; svg.style.display = 'none'; empty.hidden = false; return; }
    svg.style.display = 'block'; empty.hidden = true;

    const W=340, H=190, L=34, R=12, T=12, B=24;
    const t = ks.map(k => parseKey(k).getTime());
    const v = ks.map(k => state.entries[k]);
    const avg = ks.map(k => {
      const f = parseKey(k); f.setDate(f.getDate()-6); const fk = keyOf(f);
      const win = keys.filter(x => x >= fk && x <= k).map(x => state.entries[x]);
      return win.reduce((a,b) => a+b, 0) / win.length;
    });
    let lo = Math.min(...v), hi = Math.max(...v);
    const g = state.goal;
    const showGoal = g != null && g >= lo-3 && g <= hi+3;
    if (showGoal){ lo = Math.min(lo,g); hi = Math.max(hi,g); }
    lo = Math.floor(lo-0.3); hi = Math.ceil(hi+0.3);
    if (hi - lo < 2){ hi = lo + 2; }
    const t0 = t[0], t1 = t[t.length-1];
    const X = x => L + (x-t0)/(t1-t0)*(W-L-R);
    const Y = y => T + (hi-y)/(hi-lo)*(H-T-B);

    let s = '';
    const st = niceStep((hi-lo)/4);
    for (let i = Math.ceil(lo/st); i*st <= hi + 1e-9; i++){
      const y = r1(i*st);
      s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}"/>`;
      s += `<text class="ax" x="${L-6}" y="${Y(y)+3.5}" text-anchor="end">${fmt(y, st<1?1:0)}</text>`;
    }
    s += `<text class="ax" x="${L}" y="${H-6}">${shortDate(ks[0])}</text>`;
    s += `<text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${shortDate(ks[ks.length-1])}</text>`;
    if (showGoal) s += `<line class="goal" x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}"/>`;
    s += `<polyline class="raw" points="${t.map((x,i) => X(x).toFixed(1)+','+Y(v[i]).toFixed(1)).join(' ')}"/>`;
    s += t.map((x,i) => `<circle class="pt" cx="${X(x).toFixed(1)}" cy="${Y(v[i]).toFixed(1)}" r="2.6"/>`).join('');
    s += `<polyline class="avg" points="${t.map((x,i) => X(x).toFixed(1)+','+Y(avg[i]).toFixed(1)).join(' ')}"/>`;
    const li = t.length-1;
    s += `<circle class="last" cx="${X(t[li]).toFixed(1)}" cy="${Y(avg[li]).toFixed(1)}" r="4.5"/>`;
    svg.innerHTML = s;
  }
  $('#range').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    range = Number(b.dataset.r);
    document.querySelectorAll('#range button').forEach(x => x.classList.toggle('on', x === b));
    renderChart();
  });

  // ---------- Liste ----------
  function renderList(){
    const keys = sortedKeys().reverse(), m = statusMap(), el = $('#list');
    $('#count').textContent = keys.length ? '('+keys.length+')' : '';
    if (!keys.length){ el.innerHTML = '<p class="empty">Henüz kayıt yok. İlk tartını yukarıdan ekle.</p>'; return; }
    el.innerHTML = keys.map(k => {
      const d = parseKey(k), st = m[k];
      let chip;
      if (st.s === 'first') chip = '<span class="chip first">ilk</span>';
      else chip = `<span class="chip ${st.s}">${st.diff>0?'+':st.diff<0?'−':''}${fmt(Math.abs(st.diff))}</span>`;
      return `<div class="entry">
        <button class="d" data-edit="${k}">${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()}<small>${GUNLER[d.getDay()]}</small></button>
        <span class="kg num">${fmt(state.entries[k])}</span>${chip}
        <button class="del" data-del="${k}" aria-label="Kaydı sil">✕</button>
      </div>`;
    }).join('');
  }
  $('#list').addEventListener('click', e => {
    const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (ed) openDate(ed.dataset.edit);
    if (del){
      const k = del.dataset.del, d = parseKey(k);
      ask('Kayıt silinsin mi?', `${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()} tarihli ${fmt(state.entries[k])} kg kaydı silinecek.`, 'Sil', () => {
        delete state.entries[k]; persist(); renderAll(); toast('Silindi');
      });
    }
  });

  // ---------- Takvim ----------
  let calYear = new Date().getFullYear(), calMonth = null;
  function renderCal(){
    const m = statusMap(), box = $('#calBody'), tk = todayKey();
    $('#calTitle').textContent = calMonth == null ? calYear : AYLAR[calMonth]+' '+calYear;
    $('#calBack').hidden = calMonth == null;
    if (calMonth == null){
      let h = '<div class="year-grid">';
      for (let mo = 0; mo < 12; mo++){
        const days = new Date(calYear, mo+1, 0).getDate();
        const off = (new Date(calYear, mo, 1).getDay()+6)%7;
        let cells = '<i class="blank"></i>'.repeat(off);
        for (let d = 1; d <= days; d++){
          const k = calYear+'-'+pad(mo+1)+'-'+pad(d);
          cells += `<i class="${m[k] ? m[k].s : ''}"></i>`;
        }
        h += `<button class="mini" data-month="${mo}"><h3>${AYLAR[mo]}</h3><div class="mini-grid">${cells}</div></button>`;
      }
      box.innerHTML = h + '</div>';
    } else {
      const days = new Date(calYear, calMonth+1, 0).getDate();
      const off = (new Date(calYear, calMonth, 1).getDay()+6)%7;
      let h = '<div class="month-grid">' + ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x => `<span class="wd">${x}</span>`).join('') + '<span></span>'.repeat(off);
      for (let d = 1; d <= days; d++){
        const k = calYear+'-'+pad(calMonth+1)+'-'+pad(d), e = state.entries[k];
        const cls = ['day', m[k] ? m[k].s : '', k === tk ? 'today' : '', k > tk ? 'future' : ''].join(' ');
        h += `<button class="${cls}" data-day="${k}" aria-label="${d} ${AYLAR[calMonth]}${e!=null?', '+fmt(e)+' kg':''}"><span class="n">${d}</span>${e!=null?`<span class="w">${fmt(e)}</span>`:''}</button>`;
      }
      box.innerHTML = h + '</div>';
    }
  }
  $('#calBody').addEventListener('click', e => {
    const mo = e.target.closest('[data-month]'), day = e.target.closest('[data-day]');
    if (mo){ calMonth = Number(mo.dataset.month); renderCal(); }
    if (day) openDate(day.dataset.day);
  });
  $('#calBack').onclick = () => { calMonth = null; renderCal(); };
  function shiftCal(dir){
    if (calMonth == null) calYear += dir;
    else { calMonth += dir; if (calMonth < 0){ calMonth = 11; calYear--; } if (calMonth > 11){ calMonth = 0; calYear++; } }
    renderCal();
  }
  $('#calPrev').onclick = () => shiftCal(-1);
  $('#calNext').onclick = () => shiftCal(1);

  // ---------- Sekmeler ----------
  document.querySelector('.seg').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-selected', x === b));
    $('#pChart').hidden = b.dataset.tab !== 'pChart';
    $('#pCal').hidden = b.dataset.tab !== 'pCal';
  });

  // ---------- Onay penceresi ----------
  let onYes = null;
  function ask(title, text, yesLabel, fn){
    $('#cTitle').textContent = title; $('#cText').textContent = text; $('#cYes').textContent = yesLabel;
    onYes = fn; $('#confirmModal').classList.add('open'); $('#cNo').focus();
  }
  function closeAsk(){ $('#confirmModal').classList.remove('open'); onYes = null; }
  $('#cNo').onclick = closeAsk;
  $('#cYes').onclick = () => { const f = onYes; closeAsk(); if (f) f(); };

  // ---------- Ayarlar ----------
  function openSettings(){
    $('#goalIn').value = state.goal != null ? fmt(state.goal) : '';
    $('#startIn').value = state.start != null ? fmt(state.start) : '';
    $('#settingsModal').classList.add('open');
  }
  function closeSettings(){ $('#settingsModal').classList.remove('open'); }
  $('#openSettings').onclick = openSettings;
  $('#stCancel').onclick = closeSettings;
  $('#stSave').onclick = () => {
    const g = parseNum($('#goalIn').value), s = parseNum($('#startIn').value);
    state.goal = g != null ? r1(g) : null;
    state.start = s != null ? r1(s) : null;
    persist(); closeSettings(); renderAll(); toast('Ayarlar kaydedildi');
  };
  document.querySelectorAll('.modal').forEach(md => md.addEventListener('click', e => {
    if (e.target === md){ md.classList.remove('open'); onYes = null; }
  }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal.open').forEach(md => md.classList.remove('open'));
  });

  // Yedek
  $('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kilo-yedek-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (!d || typeof d.entries !== 'object') throw 0;
        const n = Object.keys(d.entries).length;
        closeSettings();
        ask('Yedek yüklensin mi?', `Yedekte ${n} kayıt var. Şu anki kayıtların yerine geçecek.`, 'Yükle', () => {
          state = { entries: d.entries, goal: d.goal ?? null, start: d.start ?? null };
          persist(); renderAll(); toast('Yedek yüklendi');
        });
      }catch(err){ toast('Bu dosya bir kilo yedeği değil'); }
      e.target.value = '';
    };
    rd.readAsText(file);
  });

  // ---------- Bildirim ----------
  let toastT = null;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1700);
  }

  // ---------- Başlat ----------
  function renderAll(){ renderStats(); renderChart(); renderList(); renderCal(); syncDate(false); }

  dateInput.value = todayKey();
  dateInput.max = todayKey();
  buildDial();
  const keys = sortedKeys();
  value = state.entries[todayKey()] ?? (keys.length ? state.entries[keys[keys.length-1]] : 70);
  showValue();
  renderAll();
  requestAnimationFrame(layoutDial);
  window.addEventListener('resize', layoutDial);
})();
</script>
</body>
</html>
